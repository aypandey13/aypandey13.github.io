<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayush Pandey – Backend Software Engineer</title>
<meta name="description" content="Portfolio of Ayush Pandey, backend software engineer working with .NET Core, Spring Boot and PostgreSQL.">
<!-- Share preview (LinkedIn, WhatsApp, etc.).
     Replace https://YOUR-SITE-URL/ below with your real site address. These must stay here in HTML, not in config.js. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Ayush Pandey – Backend Software Engineer">
<meta property="og:description" content="Backend engineer building secure APIs with .NET Core and Spring Boot.">
<meta property="og:url" content="https://YOUR-SITE-URL/">
<meta property="og:image" content="https://YOUR-SITE-URL/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f6; --surface:#ffffff; --ink:#1d2733; --muted:#5a6675; --line:#d9dee4; --accent:#2c5f73; --tag:#e6ecf0;
  --serif:"Source Serif 4",Georgia,serif; --sans:"IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161c22; --surface:#1c242c; --ink:#e4e9ee; --muted:#9aa6b3; --line:#2c3641; --accent:#8cbfd1; --tag:#253039}
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.layout{max-width:1080px;margin:0 auto;padding:0 28px;display:grid;grid-template-columns:300px 1fr;gap:72px}
aside{position:sticky;top:0;align-self:start;height:100vh;padding:80px 0 48px;display:flex;flex-direction:column}
h1{font:600 2.1rem/1.15 var(--serif);letter-spacing:-.01em}
.role{color:var(--accent);margin-top:6px;font-weight:500}
.tagline{color:var(--muted);margin-top:18px;font-size:.95rem}
nav{margin-top:40px;display:flex;flex-direction:column;gap:6px}
nav a{color:var(--muted);font-size:.95rem;padding:2px 0 2px 16px;border-left:2px solid var(--line);transition:color .2s,border-color .2s}
nav a:hover,nav a.active{color:var(--ink);border-color:var(--accent)}
.contact{margin-top:auto;display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
.contact a:hover{color:var(--accent)}
main{padding:80px 0 40px}
section{margin-bottom:72px;scroll-margin-top:48px}
h2{font:600 1.5rem/1.2 var(--serif);margin-bottom:28px}
.about p{color:var(--muted);max-width:62ch}.about p+p{margin-top:14px}
.timeline{border-left:1px solid var(--line);padding-left:28px;display:flex;flex-direction:column;gap:36px}
.job{position:relative}
.job::before{content:"";position:absolute;left:-34px;top:9px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:baseline}
.head h3{font:600 1.1rem var(--serif)}
.period{font-size:.88rem;color:var(--muted)}
.company{color:var(--accent);font-size:.95rem;margin-bottom:8px}
ul.pts{list-style:none;color:var(--muted);font-size:.95rem;max-width:66ch}
ul.pts li{padding-left:18px;position:relative;margin-top:6px}
ul.pts li::before{content:"";position:absolute;left:0;top:.7em;width:7px;height:1px;background:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:26px 28px;margin-bottom:20px;transition:border-color .2s}
.card:hover{border-color:var(--accent)}
.card h3{font:600 1.15rem var(--serif)}
.sum{color:var(--muted);font-size:.95rem;margin:2px 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.tags span{background:var(--tag);color:var(--muted);font-size:.8rem;padding:3px 11px;border-radius:99px}
.skills{display:grid;grid-template-columns:130px 1fr;gap:14px 20px;font-size:.95rem}
.skills dt{color:var(--muted)}
.edu{display:flex;flex-direction:column;gap:20px}
.edu .school{color:var(--muted);font-size:.95rem}
footer{border-top:1px solid var(--line);padding:28px 0 48px;color:var(--muted);font-size:.85rem}
.btn{display:inline-block;margin-top:24px;border:1px solid var(--accent);color:var(--accent);padding:8px 18px;border-radius:4px;font-size:.9rem;transition:background .2s,color .2s}
.btn:hover{background:var(--accent);color:var(--bg)}
@media (max-width:860px){
  .layout{grid-template-columns:1fr;gap:0;padding:0 22px}
  aside{position:static;height:auto;padding:56px 0 8px}
  nav{flex-direction:row;flex-wrap:wrap;gap:8px 18px;margin-top:28px}
  nav a{border-left:0;padding:0;border-bottom:2px solid transparent}
  nav a:hover,nav a.active{border-color:var(--accent)}
  .contact{margin-top:28px}
  main{padding-top:48px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <header>
      <h1 id="name"></h1>
      <p class="role" id="role"></p>
      <p class="tagline" id="tagline"></p>
      <a class="btn" id="resume" hidden>Download resume</a>
    </header>
    <nav aria-label="Sections">
      <a href="#about">About</a><a href="#experience">Experience</a><a href="#projects">Projects</a><a href="#skills">Skills</a><a href="#education">Education</a>
    </nav>
    <div class="contact" id="contact"></div>
  </aside>
  <main>
    <section id="about" class="about"><h2>About</h2><div id="about-body"></div></section>
    <section id="experience"><h2>Experience</h2><div class="timeline" id="exp"></div></section>
    <section id="projects"><h2>Projects</h2><div id="proj"></div></section>
    <section id="skills"><h2>Skills</h2><dl class="skills" id="skl"></dl></section>
    <section id="education"><h2>Education</h2><div class="edu" id="edu"></div></section>
    <footer id="foot"></footer>
  </main>
</div>

<script src="config.js"></script>
<script>
const C = CONFIG, $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const pts = a => `<ul class="pts">${a.map(p => `<li>${esc(p)}</li>`).join("")}</ul>`;

document.title = `${C.name} – ${C.role}`;
$("name").textContent = C.name;
$("role").textContent = C.role;
$("tagline").textContent = C.tagline;
if (C.contact.resumeUrl) { $("resume").href = C.contact.resumeUrl; $("resume").hidden = false; }

const c = C.contact, links = [
  c.email && `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`,
  c.phone && `<a href="tel:${esc(c.phone.replace(/[^+\d]/g, ""))}">${esc(c.phone)}</a>`,
  c.linkedin && `<a href="${esc(c.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>`,
  c.github && `<a href="${esc(c.github)}" target="_blank" rel="noopener">GitHub</a>`,
  (c.address || c.location) && `<span>${esc(c.address || c.location)}</span>`
].filter(Boolean);
$("contact").innerHTML = links.join("");

$("about-body").innerHTML = C.about.map(p => `<p>${esc(p)}</p>`).join("");

$("exp").innerHTML = C.experience.map(j => `
  <div class="job">
    <div class="head"><h3>${esc(j.title)}</h3><span class="period">${esc(j.period)}</span></div>
    <p class="company">${esc(j.company)}</p>${pts(j.points)}
  </div>`).join("");

$("proj").innerHTML = C.projects.map(p => {
  const t = p.link ? `<a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.name)}</a>` : esc(p.name);
  return `<article class="card"><h3>${t}</h3><p class="sum">${esc(p.summary)}</p>${pts(p.points)}
    <div class="tags">${p.stack.map(s => `<span>${esc(s)}</span>`).join("")}</div></article>`;
}).join("");

$("skl").innerHTML = C.skills.map(s => `<dt>${esc(s.group)}</dt><dd>${esc(s.items.join(", "))}</dd>`).join("");

$("edu").innerHTML = C.education.map(e => `
  <div><div class="head"><h3 style="font:600 1.05rem var(--serif)">${esc(e.degree)}</h3><span class="period">${esc(e.period)}</span></div>
  <p class="school">${esc(e.school)}</p></div>`).join("");

$("foot").textContent = `© ${new Date().getFullYear()} ${C.name}`;

// analytics: loads only when a code is set in config.js
const A = C.analytics || {};
if (A.goatcounter) {
  const s = document.createElement("script");
  s.async = true;
  s.src = "https://gc.zgo.at/count.js";
  s.dataset.goatcounter = `https://${A.goatcounter}.goatcounter.com/count`;
  document.head.appendChild(s);
}
if (A.googleAnalyticsId) {
  const s = document.createElement("script");
  s.async = true;
  s.src = `https://www.googletagmanager.com/gtag/js?id=${A.googleAnalyticsId}`;
  document.head.appendChild(s);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function(){ dataLayer.push(arguments); };
  gtag("js", new Date());
  gtag("config", A.googleAnalyticsId);
}

// highlight current section in the nav
const navLinks = [...document.querySelectorAll("nav a")];
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) navLinks.forEach(a => a.classList.toggle("active", a.hash === "#" + e.target.id));
}), { rootMargin: "-40% 0px -55% 0px" });
document.querySelectorAll("section").forEach(s => io.observe(s));
</script>
</body>
</html>
